[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multitrade-engine"
version = "0.35.3"
description = "Paper-first multi-strategy trading engine with centralized risk controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
multitrade = "multitrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multitrade = ["dashboard.html"]
